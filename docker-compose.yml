services:
  depart-postgres:
    container_name: depart-env-postgres
    image: postgres:18.1-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    # ports:
    #   - "5432:5432"
    restart: always